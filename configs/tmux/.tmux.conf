# Enable mouse support
set-option -g mouse on
bind-key -n MouseUp1StatusLeft switch-client -n

set -g history-file ~/.tmux_history

# Make it use C-q to avoid conflict with emacs bindings
unbind C-b
unbind l
set -g prefix C-q
bind-key C-q send-prefix

# Emacs mode
# set -gw mode-keys emacs
# set -gw status-keys emacs

# Because prefix, 1 is faster than prefix, 0
set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Merge/split windows via fzf picker (Ctrl-S inside picker to split current panes)
bind-key M-m run-shell "~/.tmux/merge-windows.sh"

# Join pane from another window, prompting for a pane title and new window name
bind-key @ command-prompt -p "Join pane from window:" \
  "join-pane -s ':%%'" \; \
  command-prompt -p "Pane label:" "set-option -p @pane_label '%%'" \; \
  command-prompt -I "#{window_name}+merged" -p "New window name:" "rename-window '%%'"

# Reload key
bind r source-file ~/.tmux.conf \; display "Reloaded!"

set -g default-terminal "tmux-256color"
set -g history-limit 100000
set -sg escape-time 10

# Required for Shift+Enter (and other extended keys) to pass through to apps like Claude Code
# Note: requires `tmux kill-server` when changing (negotiated at session start, not on reload)
set -g extended-keys always
set -as terminal-features 'xterm*:extkeys'

# Keep window names from changing
set-window-option -g automatic-rename off
set-option -g allow-rename off

# Copy buffer to system clipboard
# TODO detect OSX/Linux and copy accordingly
# bind-key M-w run "tmux show-buffer | pbcopy"

# Provide more info in the window list
bind-key w choose-window -F '#{window_name} | #(echo "#{pane_current_path}" | rev | cut -d"/" -f-3 | rev) | (#{pane_current_command})'

# Window monitoring for activity and silence
bind m setw monitor-activity \; display-message 'Monitor window activity [#{?monitor-activity,ON,OFF}]'
bind M if -F '#{monitor-silence}' \
    'setw monitor-silence 0 ; display-message "Monitor window silence [OFF]"' \
    'command-prompt -p "Monitor silence: interval (s)" "setw monitor-silence %%"'

# Activity bell and whistles
set -g visual-activity on
set -g visual-bell on
set -g visual-silence on
setw -g monitor-activity off
setw -g monitor-bell on
setw -g monitor-silence 30
set -g activity-action none
set -g bell-action other
set -g silence-action other

# Pane borders — show titles so merged panes retain context
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#fabd2f bold"
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=#fabd2f bold],#[fg=#504945]}#{?#{@pane_label},#{@pane_label},#P: #{pane_current_command}} "

# Rename the current pane (stored in user option, immune to app overwriting)
bind-key T command-prompt -I "#{@pane_label}" -p "Pane label:" "set-option -p @pane_label '%%'"

# When scrolling with mouse wheel, reduce number of scrolled rows per tick to "2" (default is 5)
bind -T copy-mode-vi WheelUpPane       select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane     select-pane \; send-keys -X -N 2 scroll-down

# Status bar
set -g status-interval 2
set -g display-time 2000
set -g status-style "bg=#282828 fg=#928374"

# Left: session name; segment turns red when prefix is active
set -g status-left-length 50
set -g status-left "#{?client_prefix,#[bg=#cc241d fg=#ffffff bold],#[bg=#504945 fg=#ebdbb2]} #S #{?client_prefix,#[fg=#cc241d bg=#282828 nobold],#[fg=#504945 bg=#282828]}\ue0b0 "

# Right: monitoring indicators for the current window only (no date/time)
set -g status-right-length 40
set -g status-right "#{?monitor-activity,#[fg=#fabd2f bold] ACT ,}#{?monitor-silence,#[fg=#83a598 bold] SIL ,}CON:#{continuum_status}"

# Window list: index, name, current command
set -g window-status-separator " "
set -g window-status-format         "#{?#{m:*~*,#{window_flags}},#{?#{==:#{pane_current_command},zsh},#{?window_last_flag,#[fg=#83a598],#[fg=#928374]},#[fg=#fe8019 bold]},#{?window_last_flag,#[fg=#83a598],#[fg=#928374]}} #I:#W (#{pane_current_command}) "
set -g window-status-current-format "#[bg=#458588 fg=#ffffff bold] #I:#W (#{pane_current_command}) #[bg=#282828 fg=#458588 nobold]\ue0b0"
set -g window-status-activity-style "fg=#fabd2f bold"
set -g window-status-bell-style     "fg=#fb4934 bold"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-yank' # prefer native iTerm integration
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# For clipboard access
set -gs set-clipboard on
set-option -g default-command "reattach-to-user-namespace -l $SHELL"

# continuum options
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'iterm'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

